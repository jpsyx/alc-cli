[package]
name = "nyintergroup-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Find New York Inter-Group AA meetings from the terminal."

[[bin]]
name = "nyintergroup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

